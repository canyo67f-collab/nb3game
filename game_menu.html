<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровое меню</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2540 0%, #1a1625 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .left-panel {
            width: 90px;
            background: rgba(20, 16, 30, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .menu-btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn.active {
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.4);
            color: #4CAF50;
        }

        .menu-btn svg {
            width: 24px;
            height: 24px;
        }

        .menu-btn.settings {
            margin-top: auto;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .player-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.2) 0%, rgba(255, 87, 34, 0.2) 100%);
            border: 2px solid rgba(255, 152, 0, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 20px;
            color: #FFB74D;
        }

        .player-details {
            flex: 1;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .player-name {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
        }

        .player-level {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.4);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            color: #FFC107;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .xp-bar {
            background: rgba(255, 255, 255, 0.08);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .xp-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, #4CAF50 0%, #66BB6A 100%);
        }

        .xp-text {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .currency-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .currency {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .currency-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25);
        }

        .currency.silver .currency-icon {
            background: linear-gradient(135deg, #d8d8d8 0%, #9a9a9a 100%);
            color: #2b2b2b;
        }

        .currency.silver .currency-value {
            color: #e8e8e8;
        }

        .character-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .character-container {
            text-align: center;
        }

        .character-frame {
            width: 280px;
            height: 420px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
        }

        .character-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 152, 0, 0.08) 0%, transparent 70%);
        }

        .character-svg {
            position: relative;
            z-index: 1;
        }

        .character-info {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 20px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .character-name {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .character-level {
            width: 32px;
            height: 32px;
            background: rgba(255, 152, 0, 0.15);
            border: 1.5px solid rgba(255, 152, 0, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            color: #FFB74D;
        }

        .bottom-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .mode-selector {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-selector:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .mode-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        .play-button {
            padding: 14px 48px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            transition: all 0.2s ease;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .icon-trophy::before {
            content: "🏆";
            margin-right: 4px;
        }

        .icon-chevron::before {
            content: "▼";
            font-size: 12px;
        }

        /* ── Inventory overlay ───────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 6, 16, 0.92);
            display: none;
            flex-direction: column;
            z-index: 30;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(20, 16, 30, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .overlay-tabs {
            display: flex;
            gap: 8px;
        }

        .overlay-tab {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .overlay-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .overlay-tab.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(229, 57, 53, 0.85) 0%, rgba(198, 40, 40, 0.85) 100%);
            box-shadow: 0 2px 8px rgba(229, 57, 53, 0.3);
        }

        .overlay-close {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .overlay-body {
            flex: 1;
            overflow: auto;
            padding: 24px 32px;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        .item-card {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 193, 7, 0.45);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .item-card .item-img-wrap {
            background: linear-gradient(135deg, #3a2f54 0%, #261c3d 100%);
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .item-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .item-meta {
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 10, 25, 0.7);
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .item-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-price {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #e8e8e8;
            font-weight: 700;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            padding: 80px 0;
            gap: 8px;
        }

        .empty-state svg {
            opacity: 0.45;
            width: 56px;
            height: 56px;
        }

        /* ── Item modal (buy / open) ────────────────── */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 24px;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            background: linear-gradient(180deg, #2a1f44 0%, #1a1330 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            max-width: 420px;
            width: 100%;
            padding: 24px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-card img {
            width: 220px;
            max-width: 100%;
            border-radius: 10px;
            margin: 0 auto 16px;
            display: block;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.45);
        }

        .btn-primary[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .price-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 16px;
            font-weight: 700;
        }

        /* ── Box opening animation ──────────────────── */
        .open-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #2a1f44 0%, #0a0613 70%);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
        }

        .open-screen.active {
            display: flex;
        }

        .reel-window {
            position: relative;
            width: min(90vw, 720px);
            height: 220px;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.15);
        }

        .reel-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            gap: 4px;
            will-change: transform;
        }

        .reel-item {
            flex: 0 0 200px;
            height: 100%;
            background: linear-gradient(135deg, #3a2f54 0%, #261c3d 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .reel-item img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .reel-marker {
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 50%;
            width: 3px;
            background: #FFC107;
            box-shadow: 0 0 12px #FFC107;
            transform: translateX(-50%);
            z-index: 2;
        }

        .open-title {
            font-size: 20px;
            font-weight: 600;
            color: #FFC107;
            margin-bottom: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(255, 193, 7, 0.55);
        }

        .open-result {
            margin-top: 24px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .open-result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .open-result .rarity {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .open-result .name {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .rarity-common    { color: #b0bec5; }
        .rarity-uncommon  { color: #66bb6a; }
        .rarity-epic      { color: #ba68c8; }
        .rarity-legendary { color: #ffb74d; }

        .open-actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <button class="menu-btn active" data-screen="home" title="Главное меню">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>

            <button class="menu-btn" data-screen="inventory" title="Инвентарь">
                <!-- Pistol icon -->
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 8 L3 7 L4 7 L4 8 L18 8 L18 9 L21 9 L21 11 L18 11 L18 13 L17 13 L20 19 L15 19 L12 13 Q10.5 14.5 9 13 L3 13 Z" />
                </svg>
            </button>

            <button class="menu-btn settings" data-screen="settings" title="Настройки">
                <!-- Gear icon -->
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/>
                </svg>
            </button>
        </div>

        <div class="main-content">
            <div class="player-info">
                <div class="player-avatar">D</div>

                <div class="player-details">
                    <div class="player-header">
                        <span class="player-name">[CLAN] Danil</span>
                        <div class="player-level">
                            <span class="icon-trophy"></span>27
                        </div>
                    </div>

                    <div class="xp-bar">
                        <div class="xp-progress"></div>
                    </div>

                    <div class="xp-text">
                        <span>XP: 6,500 / 10,000</span>
                        <span>35% до уровня 28</span>
                    </div>
                </div>

                <div class="currency-bar">
                    <div class="currency silver">
                        <span class="currency-icon">C</span>
                        <span class="currency-value" id="silverValue">1000</span>
                    </div>
                </div>
            </div>

            <div class="character-display">
                <div class="character-container">
                    <div class="character-frame">
                        <div class="character-glow"></div>

                        <svg class="character-svg" width="140" height="180" viewBox="0 0 140 180">
                            <ellipse cx="70" cy="25" rx="18" ry="24" fill="#D4A574" opacity="0.9"/>

                            <circle cx="65" cy="20" r="3" fill="#2C2C2A"/>
                            <circle cx="75" cy="20" r="3" fill="#2C2C2A"/>

                            <rect x="50" y="45" width="40" height="70" rx="8" fill="#FF7043" opacity="0.95"/>
                            <rect x="52" y="48" width="36" height="20" rx="4" fill="#E64A19" opacity="0.6"/>

                            <rect x="35" y="50" width="15" height="50" rx="6" fill="#FF7043" opacity="0.9"/>
                            <rect x="90" y="50" width="15" height="50" rx="6" fill="#FF7043" opacity="0.9"/>

                            <rect x="30" y="95" width="20" height="8" rx="4" fill="#5D4E37" opacity="0.8"/>
                            <rect x="90" y="95" width="20" height="8" rx="4" fill="#5D4E37" opacity="0.8"/>

                            <rect x="55" y="115" width="14" height="60" rx="6" fill="#78909C" opacity="0.9"/>
                            <rect x="71" y="115" width="14" height="60" rx="6" fill="#78909C" opacity="0.9"/>

                            <rect x="52" y="170" width="18" height="10" rx="4" fill="#5D4E37" opacity="0.85"/>
                            <rect x="70" y="170" width="18" height="10" rx="4" fill="#5D4E37" opacity="0.85"/>
                        </svg>
                    </div>

                    <div class="character-info">
                        <span class="character-name">Danil</span>
                        <div class="character-level">27</div>
                    </div>
                </div>
            </div>

            <div class="bottom-controls">
                <div class="mode-selector">
                    <span class="mode-text">Командный бой</span>
                    <span class="icon-chevron"></span>
                </div>

                <button class="play-button">Играть</button>
            </div>
        </div>
    </div>

    <!-- Inventory / Shop overlay -->
    <div class="overlay" id="inventoryOverlay">
        <div class="overlay-header">
            <div class="overlay-tabs">
                <button class="overlay-tab active" data-panel="inventory">Инвентарь</button>
                <button class="overlay-tab" data-panel="shop">Магазин</button>
                <button class="overlay-tab" data-panel="market">Рынок</button>
            </div>
            <div class="currency-bar">
                <div class="currency silver">
                    <span class="currency-icon">C</span>
                    <span class="currency-value" id="silverValueOverlay">1000</span>
                </div>
                <button class="overlay-close" id="overlayClose" title="Закрыть">✕</button>
            </div>
        </div>
        <div class="overlay-body">
            <div class="panel active" id="panelInventory">
                <div class="grid" id="inventoryGrid"></div>
                <div class="empty-state" id="inventoryEmpty">
                    <svg fill="currentColor" stroke="currentColor" stroke-width="0" viewBox="0 0 24 24">
                        <path d="M2 8h14a2 2 0 0 1 2 2v1h3l-1.2 4H17l-1.2 3.5a1 1 0 0 1-.95.7h-3.2a1 1 0 0 1-.83-.44L8.6 14H6.4l-.85 4.1A1 1 0 0 1 4.57 19H3.2A1.2 1.2 0 0 1 2 17.8V8z"/>
                    </svg>
                    <div>Инвентарь пуст</div>
                </div>
            </div>

            <div class="panel" id="panelShop">
                <div class="grid" id="shopGrid"></div>
            </div>

            <div class="panel" id="panelMarket">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <div>Рынок в разработке</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Buy / Open modal -->
    <div class="modal" id="itemModal">
        <div class="modal-card" id="itemModalCard">
            <!-- Filled dynamically -->
        </div>
    </div>

    <!-- Box opening screen -->
    <div class="open-screen" id="openScreen">
        <div class="open-title">Открытие кейса...</div>
        <div class="reel-window">
            <div class="reel-track" id="reelTrack"></div>
            <div class="reel-marker"></div>
        </div>
        <div class="open-result" id="openResult"></div>
        <div class="open-actions" id="openActions" style="display:none">
            <button class="btn btn-primary" id="openContinueBtn">Забрать в инвентарь</button>
        </div>
    </div>

    <script>
        // ── Data: skin pool (drops from the Fable Box) ──────────
        const SKIN_POOL = [
            { id: 'p90_jungle',      name: 'P90 "JUNGLE"',      rarity: 'common',    weight: 60, img: 'assets/p90_jungle.png' },
            { id: 'akr_worm',        name: 'AKR "WORM"',        rarity: 'uncommon',  weight: 25, img: 'assets/akr_worm.png' },
            { id: 'ump45_cerberus',  name: 'UMP45 "CERBERUS"',  rarity: 'epic',      weight: 8,  img: 'assets/ump45_cerberus.png' },
            { id: 'usp_pisces',      name: 'USP "PISCES"',      rarity: 'epic',      weight: 8,  img: 'assets/usp_pisces.png' },
            { id: 'fnfal_tactical',  name: 'FNFAL "TACTICAL"',  rarity: 'epic',      weight: 8,  img: 'assets/fnfal_tactical.png' },
            { id: 'm4_lizard',       name: 'M4 "LIZARD"',       rarity: 'legendary', weight: 3,  img: 'assets/m4_lizard.png' },
            { id: 'tec9_fable',      name: 'TEC9 "FABLE"',      rarity: 'legendary', weight: 3,  img: 'assets/tec9_fable.png' }
        ];

        const FABLE_BOX = {
            id: 'fable_box',
            name: '"Fable" Box',
            rarity: 'box',
            price: 100,
            img: 'assets/fable_box.png'
        };

        const RARITY_LABEL = {
            common: 'Common',
            uncommon: 'Uncommon',
            epic: 'Epic',
            legendary: 'Legendary'
        };

        // ── State persistence ───────────────────────────────────
        const STORAGE_KEY = 'nb3_menu_state';

        function loadState() {
            try {
                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (raw && typeof raw === 'object') {
                    return {
                        silver: typeof raw.silver === 'number' ? raw.silver : 1000,
                        inventory: Array.isArray(raw.inventory) ? raw.inventory : []
                    };
                }
            } catch (e) {}
            return { silver: 1000, inventory: [] };
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        const state = loadState();

        // ── Helpers ─────────────────────────────────────────────
        function updateSilverDisplay() {
            const els = document.querySelectorAll('#silverValue, #silverValueOverlay');
            els.forEach(el => { el.textContent = state.silver; });
        }

        function getSkinById(id) {
            return SKIN_POOL.find(s => s.id === id);
        }

        function pickRandomSkin() {
            const total = SKIN_POOL.reduce((sum, s) => sum + s.weight, 0);
            let roll = Math.random() * total;
            for (const skin of SKIN_POOL) {
                roll -= skin.weight;
                if (roll <= 0) return skin;
            }
            return SKIN_POOL[SKIN_POOL.length - 1];
        }

        // ── Menu / overlay navigation ───────────────────────────
        const overlay = document.getElementById('inventoryOverlay');
        const overlayTabs = document.querySelectorAll('.overlay-tab');
        const panelInventory = document.getElementById('panelInventory');
        const panelShop = document.getElementById('panelShop');
        const panelMarket = document.getElementById('panelMarket');

        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const screen = this.dataset.screen;
                if (screen === 'inventory') {
                    openOverlay('inventory');
                } else if (screen === 'home') {
                    closeOverlay();
                }
            });
        });

        document.getElementById('overlayClose').addEventListener('click', () => {
            closeOverlay();
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.menu-btn[data-screen="home"]').classList.add('active');
        });

        overlayTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                overlayTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.panel;
                panelInventory.classList.toggle('active', target === 'inventory');
                panelShop.classList.toggle('active', target === 'shop');
                panelMarket.classList.toggle('active', target === 'market');
            });
        });

        function openOverlay(initialTab) {
            overlay.classList.add('active');
            renderInventory();
            renderShop();
            updateSilverDisplay();
            if (initialTab) {
                overlayTabs.forEach(t => {
                    t.classList.toggle('active', t.dataset.panel === initialTab);
                });
                panelInventory.classList.toggle('active', initialTab === 'inventory');
                panelShop.classList.toggle('active', initialTab === 'shop');
                panelMarket.classList.toggle('active', initialTab === 'market');
            }
        }

        function closeOverlay() {
            overlay.classList.remove('active');
        }

        // ── Rendering: inventory & shop grids ───────────────────
        const inventoryGrid = document.getElementById('inventoryGrid');
        const inventoryEmpty = document.getElementById('inventoryEmpty');
        const shopGrid = document.getElementById('shopGrid');

        function renderInventory() {
            inventoryGrid.innerHTML = '';
            const items = state.inventory;
            if (items.length === 0) {
                inventoryEmpty.style.display = 'flex';
                return;
            }
            inventoryEmpty.style.display = 'none';

            items.forEach((entry, idx) => {
                let card;
                if (entry.type === 'box') {
                    card = createCard({
                        img: FABLE_BOX.img,
                        name: FABLE_BOX.name,
                        sub: 'Кейс'
                    });
                    card.addEventListener('click', () => openBoxModal(idx));
                } else if (entry.type === 'skin') {
                    const skin = getSkinById(entry.id);
                    if (!skin) return;
                    card = createCard({
                        img: skin.img,
                        name: skin.name,
                        sub: RARITY_LABEL[skin.rarity] || ''
                    });
                }
                if (card) inventoryGrid.appendChild(card);
            });
        }

        function renderShop() {
            shopGrid.innerHTML = '';
            const card = createCard({
                img: FABLE_BOX.img,
                name: FABLE_BOX.name,
                price: FABLE_BOX.price
            });
            card.addEventListener('click', () => openShopBoxModal());
            shopGrid.appendChild(card);
        }

        function createCard({ img, name, sub, price }) {
            const card = document.createElement('div');
            card.className = 'item-card';

            const wrap = document.createElement('div');
            wrap.className = 'item-img-wrap';
            const im = document.createElement('img');
            im.src = img;
            im.alt = name;
            wrap.appendChild(im);

            const meta = document.createElement('div');
            meta.className = 'item-meta';

            const nm = document.createElement('div');
            nm.className = 'item-name';
            nm.textContent = name;
            meta.appendChild(nm);

            const subRow = document.createElement('div');
            subRow.className = 'item-sub';
            const subText = document.createElement('span');
            subText.textContent = sub || '';
            subRow.appendChild(subText);

            if (typeof price === 'number') {
                const p = document.createElement('span');
                p.className = 'item-price';
                p.innerHTML = '<span class="currency-icon" style="width:18px;height:18px;font-size:11px">C</span>' + price;
                subRow.appendChild(p);
            }

            meta.appendChild(subRow);
            card.appendChild(wrap);
            card.appendChild(meta);
            return card;
        }

        // ── Modals: buy / open ──────────────────────────────────
        const itemModal = document.getElementById('itemModal');
        const itemModalCard = document.getElementById('itemModalCard');

        function closeItemModal() { itemModal.classList.remove('active'); }
        itemModal.addEventListener('click', e => {
            if (e.target === itemModal) closeItemModal();
        });

        function openShopBoxModal() {
            const enough = state.silver >= FABLE_BOX.price;
            itemModalCard.innerHTML = `
                <img src="${FABLE_BOX.img}" alt="${FABLE_BOX.name}">
                <div class="modal-title">${FABLE_BOX.name}</div>
                <div class="modal-subtitle">Случайный скин из Fable Collection</div>
                <div class="price-line">
                    <span class="currency-icon" style="width:20px;height:20px;font-size:12px;background:linear-gradient(135deg,#d8d8d8,#9a9a9a);color:#2b2b2b">C</span>
                    <span>${FABLE_BOX.price}</span>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
                    <button class="btn btn-primary" id="buyBtn" ${enough ? '' : 'disabled'}>${enough ? 'Купить' : 'Недостаточно'}</button>
                </div>
            `;
            itemModal.classList.add('active');
            document.getElementById('cancelBtn').addEventListener('click', closeItemModal);
            document.getElementById('buyBtn').addEventListener('click', () => {
                if (state.silver < FABLE_BOX.price) return;
                state.silver -= FABLE_BOX.price;
                state.inventory.push({ type: 'box', id: 'fable_box' });
                saveState();
                updateSilverDisplay();
                renderInventory();
                closeItemModal();
            });
        }

        function openBoxModal(inventoryIndex) {
            itemModalCard.innerHTML = `
                <img src="${FABLE_BOX.img}" alt="${FABLE_BOX.name}">
                <div class="modal-title">${FABLE_BOX.name}</div>
                <div class="modal-subtitle">В кейсе случайный скин из Fable Collection</div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancelBtn">Назад</button>
                    <button class="btn btn-primary" id="openBtn">Открыть</button>
                </div>
            `;
            itemModal.classList.add('active');
            document.getElementById('cancelBtn').addEventListener('click', closeItemModal);
            document.getElementById('openBtn').addEventListener('click', () => {
                closeItemModal();
                runOpenAnimation(inventoryIndex);
            });
        }

        // ── Box opening animation ───────────────────────────────
        const openScreen = document.getElementById('openScreen');
        const reelTrack = document.getElementById('reelTrack');
        const openResult = document.getElementById('openResult');
        const openActions = document.getElementById('openActions');

        function runOpenAnimation(inventoryIndex) {
            const result = pickRandomSkin();

            const reelLength = 60;
            const winIndex = 50; // ensure it lands far into the reel
            const items = [];
            for (let i = 0; i < reelLength; i++) {
                if (i === winIndex) items.push(result);
                else items.push(SKIN_POOL[Math.floor(Math.random() * SKIN_POOL.length)]);
            }

            reelTrack.innerHTML = '';
            items.forEach(skin => {
                const cell = document.createElement('div');
                cell.className = 'reel-item';
                const img = document.createElement('img');
                img.src = skin.img;
                img.alt = skin.name;
                cell.appendChild(img);
                reelTrack.appendChild(cell);
            });

            // Reset state
            openResult.classList.remove('show');
            openResult.innerHTML = '';
            openActions.style.display = 'none';
            reelTrack.style.transition = 'none';
            reelTrack.style.transform = 'translateX(0)';

            openScreen.classList.add('active');

            // Compute target translate so winIndex lands under center marker
            const itemWidth = 200 + 4; // flex basis + gap
            const reelWindowWidth = document.querySelector('.reel-window').clientWidth;
            const offset = winIndex * itemWidth + itemWidth / 2 - reelWindowWidth / 2;
            const jitter = (Math.random() - 0.5) * (itemWidth * 0.15);
            const targetX = -(offset + jitter);

            // Trigger animation on next frame
            requestAnimationFrame(() => {
                reelTrack.style.transition = 'transform 5.2s cubic-bezier(0.08, 0.82, 0.17, 1)';
                reelTrack.style.transform = `translateX(${targetX}px)`;
            });

            setTimeout(() => {
                openResult.innerHTML = `
                    <div class="rarity rarity-${result.rarity}">${RARITY_LABEL[result.rarity]}</div>
                    <div class="name">${result.name}</div>
                `;
                openResult.classList.add('show');
                openActions.style.display = 'flex';
            }, 5400);

            document.getElementById('openContinueBtn').onclick = () => {
                // Remove box from inventory, add skin
                state.inventory.splice(inventoryIndex, 1);
                state.inventory.push({ type: 'skin', id: result.id });
                saveState();
                renderInventory();
                openScreen.classList.remove('active');
            };
        }

        // ── Misc original UI hooks ──────────────────────────────
        document.querySelector('.play-button').addEventListener('click', function () {
            alert('Запуск игры...');
        });

        document.querySelector('.mode-selector').addEventListener('click', function () {
            alert('Выбор режима игры');
        });

        // Initial paint
        updateSilverDisplay();
    </script>
</body>
</html>
